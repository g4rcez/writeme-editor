name: MCP independent package contracts

on:
  workflow_call:
    inputs:
      fast:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - packages/mcp/**
      - package.json
      - package-lock.json
      - .github/workflows/mcp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    timeout-minutes: ${{ inputs.fast && 5 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.fast && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-2022"]') }}
        versions: ${{ fromJSON(inputs.fast && '[{"node":"24.18.0","deno":"2.4.5"}]' || '[{"node":"22.13.0","deno":"2.2.0"},{"node":"24.18.0","deno":"2.4.5"}]') }}
        exclude:
          - os: windows-2022
            versions: { node: "22.13.0", deno: "2.2.0" }
        include: ${{ fromJSON(inputs.fast && '[]' || '[{"os":"windows-2022","versions":{"node":"22.13.0","deno":"2.4.5"}}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.versions.node }}
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.versions.deno }}
      - run: npm ci --ignore-scripts --workspaces=false
        working-directory: packages/mcp
      - run: npm run validate --workspaces=false
        working-directory: packages/mcp

