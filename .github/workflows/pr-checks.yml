name: PR checks

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    platforms:
        uses: ./.github/workflows/platform-verification.yml
    mcp:
        uses: ./.github/workflows/mcp.yml
    all-checks:
        name: All PR checks passed
        if: always()
        needs: [platforms, mcp]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Require all platform, shared and independent package checks to succeed
              run: node --experimental-strip-types scripts/pr-checks.mts
              env:
                  PR_CHECK_RESULTS: ${{ toJSON(needs) }}
