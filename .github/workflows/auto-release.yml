---
name: Auto release

on:
    pull_request:
        branches: [main]
        types: [closed]

permissions:
    actions: write
    contents: write
    pull-requests: read

jobs:
    tag-and-release:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version-file: .nvmrc

            - name: Create a version tag from the merged commit
              id: tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MERGE_COMMIT_SHA: >-
                      ${{ github.event.pull_request.merge_commit_sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  set -euo pipefail
                  git merge-base --is-ancestor "$MERGE_COMMIT_SHA" HEAD

                  PULLS_API="repos/${GITHUB_REPOSITORY}/commits"
                  PULLS_API+="/${MERGE_COMMIT_SHA}/pulls"
                  TITLE=$(gh api "$PULLS_API" \
                    --jq '.[0].title // empty' || true)
                  if [[ -z "$TITLE" ]]; then
                    TITLE="${PR_TITLE:-$(git show -s --format=%s \
                      "$MERGE_COMMIT_SHA")}"
                  fi
                  BUMP_TYPE=$(node scripts/release-version.mjs classify \
                    "$TITLE")
                  echo "Commit title: $TITLE"
                  echo "Version bump: $BUMP_TYPE"

                  TAG_REFS_API="repos/${GITHUB_REPOSITORY}/git/"
                  TAG_REFS_API+="matching-refs/tags/v"
                  latest_tag() {
                    gh api --paginate "$TAG_REFS_API" \
                      --jq '.[].ref | sub("^refs/tags/"; "")' \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sort -V | tail -n 1
                  }

                  TAG=$(git tag --points-at "$MERGE_COMMIT_SHA" \
                    --list 'v*' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | sort -V | tail -n 1 || true)
                  if [[ -z "$TAG" ]]; then
                    for attempt in {1..5}; do
                      CURRENT_TAG=$(latest_tag || true)
                      if [[ -z "$CURRENT_TAG" ]]; then
                        echo "::error::No stable version tag exists."
                        exit 1
                      fi

                      VERSION=$(node scripts/release-version.mjs next \
                        "${CURRENT_TAG#v}" "$BUMP_TYPE")
                      TAG="v${VERSION}"
                      if gh api --method POST \
                        "repos/${GITHUB_REPOSITORY}/git/refs" \
                        -f "ref=refs/tags/$TAG" \
                        -f "sha=$MERGE_COMMIT_SHA" >/dev/null 2>&1; then
                        break
                      fi

                      EXISTING_SHA=$(gh api \
                        "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" \
                        --jq '.object.sha' 2>/dev/null || true)
                      if [[ "$EXISTING_SHA" == "$MERGE_COMMIT_SHA" ]]; then
                        break
                      fi
                      TAG=""
                    done
                  fi

                  if [[ -z "$TAG" ]]; then
                    echo "::error::Release tag creation failed after retries."
                    exit 1
                  fi

                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Release tag: $TAG"

            - name: Build and publish all platform assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.tag.outputs.tag }}
              run: gh workflow run release.yml --ref "$RELEASE_TAG"
