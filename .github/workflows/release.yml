name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Build Electron app
        run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Stage artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_COUNT=$(find out/make -name "*.dmg" | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 .dmg, found ${DMG_COUNT}" && exit 1
          fi
          mkdir -p release-artifacts
          find out/make -name "*.dmg" -exec cp {} "release-artifacts/writeme-${VERSION}-arm64.dmg" \;
          bun build --compile packages/cli/src/index.ts \
            --outfile "release-artifacts/writeme-darwin-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release-artifacts/

  build-mac-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Build Electron app
        run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Stage artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_COUNT=$(find out/make -name "*.dmg" | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 .dmg, found ${DMG_COUNT}" && exit 1
          fi
          mkdir -p release-artifacts
          find out/make -name "*.dmg" -exec cp {} "release-artifacts/writeme-${VERSION}-x64.dmg" \;
          bun build --compile packages/cli/src/index.ts \
            --outfile "release-artifacts/writeme-darwin-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: release-artifacts/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Build Electron app
        run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Stage artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-artifacts
          find out/make -name "*.exe" -exec cp {} "release-artifacts/writeme-${VERSION}-setup.exe" \;
          find out/make -name "*.nupkg" -exec cp {} release-artifacts/ \;
          bun build --compile packages/cli/src/index.ts \
            --outfile "release-artifacts/writeme-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-artifacts/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install rpm
        run: sudo apt-get install -y rpm

      - run: npm ci

      - name: Build Electron app
        run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Stage artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-artifacts
          find out/make -name "*.deb" -exec cp {} "release-artifacts/writeme-${VERSION}-amd64.deb" \;
          find out/make -name "*.rpm" -exec cp {} "release-artifacts/writeme-${VERSION}-x86_64.rpm" \;
          bun build --compile packages/cli/src/index.ts \
            --outfile "release-artifacts/writeme-linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release-artifacts/

  release:
    needs: [build-mac-arm64, build-mac-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        run: awk '/^## \[/{if(found) exit; found=1} found' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        run: |
          gh release download "$REF_NAME" \
            --repo g4rcez/writeme-editor \
            --pattern "writeme-*-arm64.dmg" \
            --pattern "writeme-*-x64.dmg" \
            --pattern "writeme-darwin-arm64" \
            --pattern "writeme-darwin-x64" \
            --dir ./artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git config --global http.https://github.com/.extraHeader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${TAP_TOKEN}" | base64)"

      - name: Clone tap repo
        run: git clone https://github.com/g4rcez/homebrew-writeme.git tap

      - name: Bump cask and formula
        run: |
          VERSION="${REF_NAME#v}"
          python3 scripts/bump-tap.py "$VERSION" ./artifacts ./tap

      - name: Push tap
        working-directory: tap
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Casks/writeme.rb Formula/writeme.rb
          git commit -m "chore: bump to ${REF_NAME}"
          git pull --rebase origin main
          git push
