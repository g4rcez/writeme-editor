name: Release

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    platform-verification:
        uses: ./.github/workflows/platform-verification.yml

    build-mac-arm64:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: oven-sh/setup-bun@v2

            - run: npm ci

            - name: Match package version to release tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                    npm version "$VERSION" \
                      --no-git-tag-version --ignore-scripts --workspaces=false
                  fi

            - name: Detect macOS signing mode
              env:
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: >-
                      ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              run: |
                  required=(
                    APPLE_ID
                    APPLE_APP_SPECIFIC_PASSWORD
                    APPLE_TEAM_ID
                    CSC_LINK
                    CSC_KEY_PASSWORD
                  )
                  present=0
                  for name in "${required[@]}"; do
                    if [ -n "${!name}" ]; then
                      present=$((present + 1))
                    fi
                  done

                  if [ "$present" -eq "${#required[@]}" ]; then
                    echo "MACOS_SIGNING_MODE=signed" >> "$GITHUB_ENV"
                    echo "macOS artifacts will be signed and notarized."
                  elif [ "$present" -eq 0 ]; then
                    echo "MACOS_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
                    echo "::notice::Apple signing secrets are not configured."
                    echo "Publishing unsigned macOS DMG."
                  else
                    echo "::error::Set every Apple signing secret, or none."
                    for name in "${required[@]}"; do
                      if [ -z "${!name}" ]; then
                        echo "::error::Missing macOS signing secret: ${name}"
                      fi
                    done
                    exit 1
                  fi

            - name: Import Apple Developer ID certificate
              if: env.MACOS_SIGNING_MODE == 'signed'
              env:
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              run: scripts/import-macos-signing-cert.sh

            - name: Build Electron app
              run: npm run make -- --arch=arm64
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: >-
                      ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

            - name: Install Playwright recording runtime
              run: npm exec playwright -- install chromium

            - name: Set packaged executable path
              run: |
                  EXECUTABLE_PATH="out/writeme-darwin-arm64"
                  EXECUTABLE_PATH+="/writeme.app"
                  EXECUTABLE_PATH+="/Contents/MacOS/writeme"
                  echo "WRITEME_PACKAGED_EXECUTABLE=$EXECUTABLE_PATH" \
                    >> "$GITHUB_ENV"

            - name: Verify packaged handwriting before staging release
              run: >-
                  npm run test:e2e -- --platform osx --suite native
                  tests/native/freehand-note.spec.ts
                  --grep "packaged application"
              env:
                  WRITEME_E2E_PREBUILT: "1"

            - name: Upload packaged handwriting evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: handwriting-release-macos
                  path: artifacts/playwright/osx/native/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Verify macOS signature and notarization
              if: env.MACOS_SIGNING_MODE == 'signed'
              run: |
                  APP_PATH=$(find out -type d -name "writeme.app" -print -quit)
                  if [ -z "$APP_PATH" ]; then
                    echo "::error::writeme.app was not found under out/"
                    exit 1
                  fi
                  codesign --verify --deep --strict --verbose=2 "$APP_PATH"
                  xcrun stapler validate "$APP_PATH"
                  spctl --assess --type execute --verbose=4 "$APP_PATH"

            - name: Delete signing keychain
              if: always()
              run: |
                  if [ -n "${KEYCHAIN_PATH:-}" ]; then
                    security delete-keychain "$KEYCHAIN_PATH" || true
                  fi

            - name: Stage artifacts
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "ERROR: package version differs from release tag."
                    exit 1
                  fi
                  test -d out/make
                  DMG_COUNT=$(find out/make -name "*.dmg" | wc -l | tr -d ' ')
                  if [ "$DMG_COUNT" -ne 1 ]; then
                    echo "ERROR: expected one .dmg; found $DMG_COUNT"
                    exit 1
                  fi
                  mkdir -p release-artifacts
                  if [ "${MACOS_SIGNING_MODE}" = "signed" ]; then
                    DMG_NAME="writeme-${VERSION}-arm64.dmg"
                  else
                    DMG_NAME="writeme-${VERSION}-arm64-unsigned.dmg"
                  fi
                  find out/make -name "*.dmg" \
                    -exec cp {} "release-artifacts/${DMG_NAME}" \;
                  DARWIN_ZIP="writeme-${VERSION}-darwin-arm64.zip"
                  find out/make -name "*.zip" \
                    -exec cp {} "release-artifacts/$DARWIN_ZIP" \;
                  bun build --compile packages/cli/src/index.ts \
                    --outfile "release-artifacts/writeme-darwin-arm64"
                  test -f "release-artifacts/${DMG_NAME}"
                  test -f "release-artifacts/$DARWIN_ZIP"
                  test -f "release-artifacts/writeme-darwin-arm64"

            - uses: actions/upload-artifact@v4
              with:
                  name: mac-arm64
                  path: release-artifacts/
                  if-no-files-found: error

    build-windows:
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: oven-sh/setup-bun@v2

            - run: npm ci

            - name: Match package version to release tag
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                    npm version "$VERSION" \
                      --no-git-tag-version --ignore-scripts --workspaces=false
                  fi

            - name: Build Electron app
              run: npm run make
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Install Playwright recording runtime
              run: npm exec playwright -- install chromium

            - name: Verify packaged handwriting before staging release
              run: >-
                  npm run test:e2e -- --platform windows --suite native
                  tests/native/freehand-note.spec.ts
                  --grep "packaged application"
              env:
                  WRITEME_E2E_PREBUILT: "1"

            - name: Upload packaged handwriting evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: handwriting-release-windows
                  path: artifacts/playwright/windows/native/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stage artifacts
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "ERROR: package version differs from release tag."
                    exit 1
                  fi
                  test -d out/make
                  mkdir -p release-artifacts
                  WINDOWS_SETUP="writeme-${VERSION}-setup.exe"
                  WINDOWS_ZIP="writeme-${VERSION}-win32-x64.zip"
                  find out/make -name "*.exe" \
                    -exec cp {} "release-artifacts/$WINDOWS_SETUP" \;
                  find out/make -name "*.nupkg" \
                    -exec cp {} release-artifacts/ \;
                  find out/make -name "*.zip" \
                    -exec cp {} "release-artifacts/$WINDOWS_ZIP" \;
                  bun build --compile packages/cli/src/index.ts \
                    --outfile "release-artifacts/writeme-windows-x64.exe"
                  test -f "release-artifacts/$WINDOWS_SETUP"
                  NUPKG=$(find release-artifacts -name '*.nupkg' -print -quit)
                  test -n "$NUPKG"
                  test -f "release-artifacts/$WINDOWS_ZIP"
                  test -f "release-artifacts/writeme-windows-x64.exe"

            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: release-artifacts/
                  if-no-files-found: error

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: oven-sh/setup-bun@v2

            - name: Install Linux package makers
              run: >-
                  sudo apt-get update && sudo apt-get install -y
                  dpkg fakeroot rpm

            - run: npm ci

            - name: Match package version to release tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                    npm version "$VERSION" \
                      --no-git-tag-version --ignore-scripts --workspaces=false
                  fi

            - name: Prepare Linux package files
              run: node scripts/prepare-linux-packaging.mjs

            - name: Build Electron app
              run: npm run make
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Install Playwright recording runtime
              run: npm exec playwright -- install --with-deps chromium

            - name: Verify packaged handwriting before staging release
              run: >-
                  xvfb-run --auto-servernum npm run test:e2e -- --platform linux
                  --suite native tests/native/freehand-note.spec.ts
                  --grep "packaged application"
              env:
                  WRITEME_E2E_PREBUILT: "1"

            - name: Upload packaged handwriting evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: handwriting-release-linux
                  path: artifacts/playwright/linux/native/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stage artifacts
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "ERROR: package version differs from release tag."
                    exit 1
                  fi
                  test -d out/make
                  mkdir -p release-artifacts
                  DEB_NAME="writeme-${VERSION}-amd64.deb"
                  RPM_NAME="writeme-${VERSION}-x86_64.rpm"
                  LINUX_ZIP="writeme-${VERSION}-linux-x64.zip"
                  find out/make -name "*.deb" \
                    -exec cp {} "release-artifacts/$DEB_NAME" \;
                  find out/make -name "*.rpm" \
                    -exec cp {} "release-artifacts/$RPM_NAME" \;
                  find out/make -name "*.zip" \
                    -exec cp {} "release-artifacts/$LINUX_ZIP" \;
                  bun build --compile packages/cli/src/index.ts \
                    --outfile "release-artifacts/writeme-linux-x64"
                  test -f "release-artifacts/$DEB_NAME"
                  test -f "release-artifacts/$RPM_NAME"
                  test -f "release-artifacts/$LINUX_ZIP"
                  test -f "release-artifacts/writeme-linux-x64"

            - uses: actions/upload-artifact@v4
              with:
                  name: linux
                  path: release-artifacts/
                  if-no-files-found: error

    build-android:
        uses: ./.github/workflows/build-android.yml
        with:
            release: true
            sync_version_to_tag: true

    build-ios:
        uses: ./.github/workflows/build-ios.yml
        with:
            release: true
            sync_version_to_tag: true

    release:
        needs:
            - platform-verification
            - build-mac-arm64
            - build-windows
            - build-linux
            - build-android
            - build-ios
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: mac-arm64
                  path: artifacts

            - uses: actions/download-artifact@v4
              with:
                  name: windows
                  path: artifacts

            - uses: actions/download-artifact@v4
              with:
                  name: linux
                  path: artifacts

            - uses: actions/download-artifact@v4
              with:
                  name: android
                  path: artifacts

            - uses: actions/download-artifact@v4
              with:
                  name: ios
                  path: artifacts

            - name: Generate release notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                    -f tag_name="$REF_NAME" \
                    --jq .body > release-notes.md
                  if find artifacts -name "*-arm64-unsigned.dmg" \
                    -print -quit | grep -q .; then
                    cat >> release-notes.md <<'EOF'

                  ### macOS unsigned DMG

                  This release includes an unsigned macOS DMG because
                  Apple signing credentials were not configured. After
                  dragging `writeme.app` to `/Applications`, run:

                  ```bash
                  xattr -dr com.apple.quarantine /Applications/writeme.app
                  open /Applications/writeme.app
                  ```
                  EOF
                  fi
                  cat >> release-notes.md <<'EOF'

                  ### Mobile downloads

                  - Android: `writeme-<version>-android-debug.apk`
                    is an installable debug APK for testing. Allow
                    installation from the app used to download it. Debug
                    signing is not suitable for Google Play. Updates may
                    require uninstalling; export a library backup.
                  - iOS/iPadOS: `writeme-<version>-ios-unsigned.ipa`
                    contains a Release build for physical devices. Sign it
                    with an Apple certificate and provisioning profile.
                    It cannot be installed directly or used with the App
                    Store or TestFlight.
                  EOF

            - uses: softprops/action-gh-release@v2
              with:
                  body_path: release-notes.md
                  files: artifacts/**
                  overwrite_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    bump-tap:
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            REF_NAME: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Download macOS artifacts
              run: |
                  gh release download "$REF_NAME" \
                    --repo g4rcez/writeme-editor \
                    --pattern "writeme-*-arm64*.dmg" \
                    --pattern "writeme-darwin-arm64" \
                    --dir ./artifacts
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git credentials
              env:
                  GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
              run: gh auth setup-git --hostname github.com

            - name: Clone tap repo
              env:
                  GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
              run: git clone https://github.com/g4rcez/homebrew-writeme.git tap

            - name: Bump cask and formula
              run: |
                  VERSION="${REF_NAME#v}"
                  python3 scripts/bump-tap.py "$VERSION" ./artifacts ./tap

            - name: Push tap
              working-directory: tap
              env:
                  GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
              run: |
                  git config user.email \
                    "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  git add Casks/writeme.rb Formula/writeme.rb
                  git commit -m "chore: bump to ${REF_NAME}"
                  git pull --rebase origin main
                  git push
