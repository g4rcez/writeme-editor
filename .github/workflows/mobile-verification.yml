name: Mobile build and runtime verification

on:
    workflow_call:

permissions:
    contents: read

jobs:
    mobile:
        name: Mobile ${{ matrix.platform }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ios
                      os: macos-15
                      browsers: webkit
                      profile: ios-app-store
                    - platform: android
                      os: ubuntu-latest
                      browsers: chromium
                      profile: android-google-play
        env:
            CI: "true"
            NODE_OPTIONS: --max-old-space-size=4096
            WRITEME_E2E_PREBUILT: "1"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - uses: actions/setup-java@v4
              if: matrix.platform == 'android'
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle
                  cache-dependency-path: |
                      packages/android/native/**/*.gradle
                      packages/android/native/gradle/wrapper/gradle-wrapper.properties
            - uses: android-actions/setup-android@v3
              if: matrix.platform == 'android'
              with:
                  packages: platform-tools
            - name: Install Android SDK
              if: matrix.platform == 'android'
              run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
            - uses: maxim-lobanov/setup-xcode@v1
              if: matrix.platform == 'ios'
              with:
                  xcode-version: "26"
            - run: npm ci --ignore-scripts
            - run: npm exec playwright -- install --with-deps ${{ matrix.browsers }}
            - run: npm run browser:build
            - name: Verify portable browser scenarios
              run: npm run test:e2e -- --platform ${{ matrix.platform }} --suite browser
            - name: Verify production handwriting and root web drawing
              run: npm run test:e2e -- --platform ${{ matrix.platform }} --suite production
            - name: Build and sync restricted mobile assets once
              run: npm run ${{ matrix.platform }}:sync
            - name: Verify all mobile shell scenarios
              run: npm run test:e2e -- --platform ${{ matrix.platform }} --suite mobile
              env:
                  WRITEME_BUILD_PROFILE: ${{ matrix.profile }}
            - name: Verify store restrictions with the synced bundle
              run: npm run test:e2e -- --platform ${{ matrix.platform }} --suite profiles
              env:
                  WRITEME_BUILD_PROFILE: ${{ matrix.profile }}
                  WRITEME_E2E_PROFILE_DIR: packages/mobile/dist
            - name: Compile Android APK
              if: matrix.platform == 'android'
              working-directory: packages/android/native
              run: >-
                  ./gradlew assembleDebug
                  -PwritemeVersionName="$(node -p "require('../../../package.json').version")"
                  -PwritemeVersionCode="$GITHUB_RUN_NUMBER"
            - name: Archive unsigned iOS device app
              if: matrix.platform == 'ios'
              run: |
                  xcodebuild \
                    -project packages/ios/native/App/App.xcodeproj \
                    -scheme App -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath packages/ios/build/release \
                    -archivePath packages/ios/build/Writeme.xcarchive \
                    MARKETING_VERSION="$(node -p "require('./package.json').version")" \
                    CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
                    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
            - name: Stage mobile application artifacts
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  mkdir -p release-artifacts
                  if [ '${{ matrix.platform }}' = android ]; then
                      cp packages/android/native/app/build/outputs/apk/debug/app-debug.apk \
                        "release-artifacts/writeme-${VERSION}-android-debug.apk"
                      test -s "release-artifacts/writeme-${VERSION}-android-debug.apk"
                  else
                      APP_PATH=packages/ios/build/Writeme.xcarchive/Products/Applications/App.app
                      test -s "$APP_PATH/App"
                      mkdir -p "$RUNNER_TEMP/writeme-ios/Payload"
                      cp -R "$APP_PATH" "$RUNNER_TEMP/writeme-ios/Payload/"
                      APP_OUTPUT="$GITHUB_WORKSPACE/release-artifacts/writeme-${VERSION}-ios-unsigned.ipa"
                      (cd "$RUNNER_TEMP/writeme-ios" && zip -qry "$APP_OUTPUT" Payload)
                      test -s "$APP_OUTPUT"
                  fi
            - uses: actions/upload-artifact@v4
              with:
                  name: platform-build-${{ matrix.platform }}
                  path: release-artifacts/
                  if-no-files-found: error
            - name: Upload mobile evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mobile-verification-${{ matrix.platform }}
                  path: artifacts/playwright/${{ matrix.platform }}/
                  if-no-files-found: warn
                  retention-days: 14
