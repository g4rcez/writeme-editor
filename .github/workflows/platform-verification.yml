name: Platform verification

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: platform-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
    checks:
        uses: ./.github/workflows/test.yml

    verify:
        name: Verify ${{ matrix.platform }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows
                      os: windows-2022
                      browsers: chromium
                      desktop: true
                    - platform: ios
                      os: macos-15
                      browsers: webkit
                      profile: ios-app-store
                      desktop: false
                    - platform: osx
                      os: macos-latest
                      browsers: chromium webkit
                      desktop: true
                    - platform: linux
                      os: ubuntu-latest
                      browsers: chromium
                      desktop: true
                    - platform: android
                      os: ubuntu-latest
                      browsers: chromium
                      profile: android-google-play
                      desktop: false
        env:
            CI: "true"
            NODE_OPTIONS: --max-old-space-size=4096
            WRITEME_E2E_PREBUILT: "1"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      packages/landing/package-lock.json
            - uses: oven-sh/setup-bun@v2
              if: matrix.desktop
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-java@v4
              if: matrix.platform == 'android'
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle
                  cache-dependency-path: |
                      packages/android/native/**/*.gradle
                      packages/android/native/gradle/wrapper/gradle-wrapper.properties
            - uses: android-actions/setup-android@v3
              if: matrix.platform == 'android'
              with:
                  packages: platform-tools
            - name: Install Android SDK
              if: matrix.platform == 'android'
              run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
            - uses: maxim-lobanov/setup-xcode@v1
              if: matrix.platform == 'ios'
              with:
                  xcode-version: "26"
            - run: npm ci
            - name: Install selected Playwright browsers
              run: npm exec playwright -- install --with-deps ${{ matrix.browsers }}
            - name: Compile the shared web bundle once
              run: npm run browser:build
            - name: Verify handwritten notebooks
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite browser tests/e2e/freehand-note.spec.ts
                  ${{ matrix.platform == 'osx' && '--project desktop-macos' || '' }}
            - name: Verify formatted editor Vim mode
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite browser tests/e2e/neovim.spec.ts
                  tests/e2e/vim-settings.spec.ts --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/neovim
            - name: Verify Vim configuration in a production browser build
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite production tests/e2e/vim-settings.spec.ts
                  --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/vim-production
            - name: Verify desktop tab CRUD, persistence and restoration
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite browser tests/e2e/editor-tabs.spec.ts
                  tests/e2e/tab-rename.spec.ts
                  tests/e2e/recently-closed-tab.spec.ts
                  tests/e2e/editor-tab-drag.spec.ts --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/tabs
            - name: Verify uneven Markdown table opening, paste and persistence
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite browser tests/e2e/markdown-tables.spec.ts --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/markdown-tables
            - name: Verify task board initialization and filter recovery
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite browser tests/e2e/task-note.spec.ts
                  tests/e2e/task-filter-recovery.spec.ts --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/task-board
            - name: Verify handwriting production and offline persistence
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite production tests/e2e/freehand-production.spec.ts
                  tests/e2e/freehand-lifecycle.spec.ts
                  tests/e2e/freehand-pens.spec.ts
                  tests/e2e/freehand-pen-dots.spec.ts
                  ${{ matrix.platform == 'osx' &&
                  '--project desktop-macos' || '' }}
            - name: Verify desktop meeting production persistence
              if: matrix.desktop
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite production tests/e2e/meeting-note.spec.ts
                  --project chromium
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/meeting
            - name: Build and sync mobile assets once
              if: "!matrix.desktop"
              run: npm run ${{ matrix.platform }}:sync
            - name: Verify mobile editor
              if: "!matrix.desktop"
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite mobile
              env:
                  WRITEME_BUILD_PROFILE: ${{ matrix.profile }}
            - name: Verify mobile browser Excalidraw
              if: "!matrix.desktop"
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite production tests/mobile/excalidraw.spec.ts
                  --project ${{ matrix.platform }}-web-drawing
              env:
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/${{ matrix.platform }}/excalidraw-web
            - name: Verify mobile store restrictions with the synced bundle
              if: "!matrix.desktop"
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite profiles
              env:
                  WRITEME_BUILD_PROFILE: ${{ matrix.profile }}
                  WRITEME_E2E_PROFILE_DIR: packages/mobile/dist
            - name: Build macOS restriction profiles
              if: matrix.platform == 'osx'
              run: |
                  npm run build:profile -- macos-homebrew
                  WRITEME_BUILD_PROFILE=macos-app-store \
                      node --import tsx scripts/build-native-profile.ts
            - name: Verify native-store renderer browser restrictions
              if: matrix.platform == 'osx'
              run: >-
                  npm run test:e2e -- --platform osx --suite profiles
                  --project macos-app-store
              env:
                  WRITEME_E2E_PROFILE_DIR: >-
                      artifacts/build-profiles/macos-app-store/renderer/main_window
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/osx/store-renderer
            - name: Verify macOS store and Homebrew restrictions
              if: matrix.platform == 'osx'
              run: >-
                  npm run test:e2e -- --platform osx --suite profiles
                  --project macos-homebrew --project native-store
            - name: Install Linux package makers
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update &&
                  sudo apt-get install -y dpkg fakeroot rpm ffmpeg cmake
            - name: Prepare Linux package files
              if: matrix.platform == 'linux'
              run: node scripts/prepare-linux-packaging.mjs
            - name: Build MCP integration package
              if: matrix.platform == 'osx'
              run: npm run build --workspace @writeme.dev/mcp
            - name: Make desktop distributables and package once
              if: matrix.desktop
              run: npm run make
            - name: Verify compiled and packaged Electron persistence
              if: matrix.desktop && matrix.platform != 'linux'
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.platform }}
                  --suite native tests/native/freehand-note.spec.ts
                  tests/native/meeting-note.spec.ts
                  tests/native/application-menu.spec.ts
            - name: Verify compiled and packaged Linux persistence
              if: matrix.platform == 'linux'
              run: >-
                  xvfb-run --auto-servernum npm run test:e2e -- --platform linux
                  --suite native tests/native/freehand-note.spec.ts
                  tests/native/meeting-note.spec.ts
            - name: Verify MCP native saved state using the same macOS package
              if: matrix.platform == 'osx'
              run: npm run test:e2e --workspace @writeme.dev/mcp
            - name: Compile Android APK
              if: matrix.platform == 'android'
              working-directory: packages/android/native
              run: >-
                  ./gradlew assembleDebug
                  -PwritemeVersionName="$(node -p
                  "require('../../../package.json').version")"
                  -PwritemeVersionCode="$GITHUB_RUN_NUMBER"
            - name: Archive unsigned iOS device app
              if: matrix.platform == 'ios'
              run: |
                  xcodebuild \
                    -project packages/ios/native/App/App.xcodeproj \
                    -scheme App \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath packages/ios/build/release \
                    -archivePath packages/ios/build/Writeme.xcarchive \
                    MARKETING_VERSION="$(node -p \
                      "require('./package.json').version")" \
                    CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    archive
            - name: Stage mobile application artifacts
              if: "!matrix.desktop"
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  mkdir -p release-artifacts
                  if [ '${{ matrix.platform }}' = android ]; then
                      APK_DIR=packages/android/native/app/build/outputs/apk
                      APK_DEST="release-artifacts/"
                      APK_DEST+="writeme-${VERSION}-android-debug.apk"
                      cp "$APK_DIR/debug/app-debug.apk" "$APK_DEST"
                      test -s "$APK_DEST"
                  else
                      APP_PATH=packages/ios/build/Writeme.xcarchive/Products/Applications/App.app
                      test -s "$APP_PATH/App"
                      mkdir -p "$RUNNER_TEMP/writeme-ios/Payload"
                      cp -R "$APP_PATH" "$RUNNER_TEMP/writeme-ios/Payload/"
                      APP_OUTPUT_DIR="$GITHUB_WORKSPACE/release-artifacts"
                      APP_OUTPUT_NAME="writeme-${VERSION}-ios-unsigned.ipa"
                      (cd "$RUNNER_TEMP/writeme-ios" && \
                        zip -qry "$APP_OUTPUT_DIR/$APP_OUTPUT_NAME" Payload)
                      test -s "$APP_OUTPUT_DIR/$APP_OUTPUT_NAME"
                  fi
            - name: Install landing dependencies
              if: matrix.platform == 'linux'
              run: npm ci --prefix packages/landing
            - name: Verify landing types, lint and production build
              if: matrix.platform == 'linux'
              run: |
                  npm --prefix packages/landing run typecheck
                  npm --prefix packages/landing run lint
                  npm --prefix packages/landing run build
            - name: Verify landing downloads
              if: matrix.platform == 'linux'
              run: npm run test:e2e -- --platform linux --suite landing
            - name: Check out pinned Whisper server
              if: matrix.platform == 'linux'
              uses: actions/checkout@v4
              with:
                  repository: ggml-org/whisper.cpp
                  ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
                  path: .whisper-test
                  persist-credentials: false
            - name: Cache the checksum-verified Whisper model
              if: matrix.platform == 'linux'
              uses: actions/cache@v4
              with:
                  path: .whisper-test/models/ggml-tiny.bin
                  key: "whisper-tiny-be07e048e1e599ad46341c8d2a135645\
                      097a538221678b7acdd1b1919c6e1b21"
            - name: Compile pinned CPU Whisper server
              if: matrix.platform == 'linux'
              run: |
                  cmake -S .whisper-test -B .whisper-test/build \
                    -DWHISPER_BUILD_SERVER=ON -DGGML_NATIVE=OFF
                  cmake --build .whisper-test/build \
                    --target whisper-server --parallel 2
                  bash .whisper-test/models/download-ggml-model.sh tiny
                  WHISPER_HASH=be07e048e1e599ad46341c8d2a135645
                  WHISPER_HASH+=097a538221678b7acdd1b1919c6e1b21
                  printf '%s  %s\n' "$WHISPER_HASH" \
                    .whisper-test/models/ggml-tiny.bin | sha256sum --check
            - name: Transcribe browser audio using live local Whisper
              if: matrix.platform == 'linux'
              run: |
                  .whisper-test/build/bin/whisper-server \
                    --model .whisper-test/models/ggml-tiny.bin \
                    --threads 4 --port 8097 --convert --language auto \
                    > "$RUNNER_TEMP/whisper-server.log" 2>&1 &
                  WHISPER_PID=$!
                  trap 'kill "$WHISPER_PID"' EXIT
                  for attempt in {1..30}; do
                      if curl --fail --silent http://localhost:8097/health >/dev/null; then
                          break
                      fi
                      sleep 1
                  done
                  curl --fail --silent http://localhost:8097/health >/dev/null
                  MEETING_AUDIO_FIXTURE="$PWD"
                  MEETING_AUDIO_FIXTURE+="/.whisper-test/samples/jfk.wav"
                  export MEETING_AUDIO_FIXTURE
                  npm run test:e2e -- --platform linux --suite production \
                    tests/e2e/meeting-note.spec.ts --project chromium \
                    --grep 'live local Whisper'
              env:
                  MEETING_WHISPER_ENDPOINT: http://localhost:8097/inference
                  PLAYWRIGHT_ARTIFACT_DIR: >-
                      artifacts/playwright/linux/live-whisper
            - name: Upload desktop distributables
              if: matrix.desktop
              uses: actions/upload-artifact@v4
              with:
                  name: platform-build-${{ matrix.platform }}
                  path: out/make/**
                  if-no-files-found: error
            - name: Upload mobile application artifacts
              if: "!matrix.desktop"
              uses: actions/upload-artifact@v4
              with:
                  name: platform-build-${{ matrix.platform }}
                  path: release-artifacts/
                  if-no-files-found: error
            - name: Upload verification evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: platform-verification-${{ matrix.platform }}
                  path: |
                      artifacts/playwright/${{ matrix.platform }}/
                      artifacts/playwright/build-profiles/
                      artifacts/build-profiles/**/writeme-build-*.json
                      .omo/evidence/mcp-integration/native/
                      ${{ runner.temp }}/whisper-server.log
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 14
