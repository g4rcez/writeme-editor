name: Platform verification

on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: platform-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
    checks:
        uses: ./.github/workflows/test.yml
    browser:
        uses: ./.github/workflows/browser-verification.yml
    desktop:
        uses: ./.github/workflows/desktop-verification.yml
    mobile:
        uses: ./.github/workflows/mobile-verification.yml
    integrations:
        uses: ./.github/workflows/web-integrations.yml
