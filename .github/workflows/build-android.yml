name: Build Android

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            release:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle
                  cache-dependency-path: |
                      packages/android/native/**/*.gradle
                      packages/android/native/**/gradle-wrapper.properties

            - uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Install Android SDK
              run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

            - run: npm ci

            - name: Resolve artifact version
              id: version
              env:
                  RELEASE_BUILD: ${{ inputs.release }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "$RELEASE_BUILD" = "true" ]; then
                    RELEASE_VERSION="${REF_NAME#v}"
                    if [ "$VERSION" != "$RELEASE_VERSION" ]; then
                      npm version "$RELEASE_VERSION" \
                        --no-git-tag-version --ignore-scripts --workspaces=false
                      VERSION="$RELEASE_VERSION"
                    fi
                    if [ "$RELEASE_VERSION" != "$VERSION" ]; then
                      echo "::error::Release tag does not match app version."
                      exit 1
                    fi
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            - name: Build and sync Android assets
              run: npm run android:sync

            - name: Verify mobile editor
              run: |
                  npm exec -- playwright install --with-deps chromium
                  WRITEME_E2E_PREBUILT=1 \
                    npm run test:e2e -- --platform android --suite mobile
                  npm run browser:build
                  WRITEME_E2E_PREBUILT=1 \
                    npm run test:e2e -- --platform android --suite production \
                    tests/mobile/excalidraw.spec.ts \
                    --project android-web-drawing

            - name: Build Android APK
              working-directory: packages/android/native
              run: >-
                  ./gradlew assembleDebug
                  -PwritemeVersionName="$VERSION"
                  -PwritemeVersionCode="$GITHUB_RUN_NUMBER"

            - name: Stage artifacts
              id: stage
              run: |
                  mkdir -p release-artifacts
                  APK_DIR="packages/android/native/app/build/outputs/apk"
                  APK_SOURCE="$APK_DIR/debug/app-debug.apk"
                  APK_NAME="writeme-${VERSION}-android-debug.apk"
                  cp "$APK_SOURCE" "release-artifacts/$APK_NAME"
                  test -s "release-artifacts/$APK_NAME"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.release && 'android' || 'build-android' }}
                  path: release-artifacts/
                  if-no-files-found: error

            - name: Upload verification failures
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: mobile-android-failures
                  path: artifacts/playwright/android/
                  if-no-files-found: ignore
