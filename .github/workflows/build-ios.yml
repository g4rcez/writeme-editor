name: Build iOS

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            release:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    build:
        runs-on: macos-15
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: "26"

            - run: npm ci

            - name: Resolve artifact version
              id: version
              env:
                  RELEASE_BUILD: ${{ inputs.release }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "$RELEASE_BUILD" = "true" ]; then
                    RELEASE_VERSION="${REF_NAME#v}"
                    if [ "$VERSION" != "$RELEASE_VERSION" ]; then
                      npm version "$RELEASE_VERSION" \
                        --no-git-tag-version --ignore-scripts --workspaces=false
                      VERSION="$RELEASE_VERSION"
                    fi
                    if [ "$RELEASE_VERSION" != "$VERSION" ]; then
                      echo "::error::Release tag does not match app version."
                      exit 1
                    fi
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            - name: Build and sync iOS assets
              run: npm run ios:sync

            - name: Verify mobile editor
              run: |
                  npm exec -- playwright install webkit
                  WRITEME_E2E_PREBUILT=1 \
                    npm run test:e2e -- --platform ios --suite mobile
                  npm run browser:build
                  WRITEME_E2E_PREBUILT=1 \
                    npm run test:e2e -- --platform ios --suite production \
                    tests/mobile/excalidraw.spec.ts \
                    --project ios-web-drawing

            - name: Archive unsigned iOS device app
              run: |
                  xcodebuild \
                    -project packages/ios/native/App/App.xcodeproj \
                    -scheme App \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath packages/ios/build/release \
                    -archivePath packages/ios/build/Writeme.xcarchive \
                    MARKETING_VERSION="$VERSION" \
                    CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    archive

            - name: Stage artifacts
              id: stage
              run: |
                  APP_PATH=packages/ios/build/Writeme.xcarchive
                  APP_PATH+="/Products/Applications/App.app"
                  test -s "$APP_PATH/App"
                  mkdir -p release-artifacts "$RUNNER_TEMP/writeme-ios/Payload"
                  cp -R "$APP_PATH" "$RUNNER_TEMP/writeme-ios/Payload/"
                  IPA_OUTPUT="$GITHUB_WORKSPACE/release-artifacts"
                  IPA_NAME="writeme-${VERSION}-ios-unsigned.ipa"
                  cd "$RUNNER_TEMP/writeme-ios"
                  zip -qry "$IPA_OUTPUT/$IPA_NAME" Payload
                  test -s "$IPA_OUTPUT/$IPA_NAME"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.release && 'ios' || 'build-ios' }}
                  path: release-artifacts/
                  if-no-files-found: error

            - name: Upload verification failures
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: mobile-ios-failures
                  path: artifacts/playwright/ios/
                  if-no-files-found: ignore
