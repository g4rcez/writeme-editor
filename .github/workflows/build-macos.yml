name: Build macOS

on:
    workflow_dispatch:
    workflow_call:

jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: oven-sh/setup-bun@v2

            - run: npm ci

            - run: npm run make -- --arch=arm64
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Verify native Cmd+Q menu action
              run: |
                  npm exec -- electron-rebuild
                  npm exec playwright -- install ffmpeg
                  npm run test:e2e -- --platform osx --suite native tests/native/application-menu.spec.ts
              env:
                  WRITEME_E2E_PREBUILT: "1"

            - uses: actions/upload-artifact@v4
              with:
                  name: build-macos
                  path: out/make/**
                  if-no-files-found: error
