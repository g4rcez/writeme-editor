name: Shared checks

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            fast:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    units:
        name: Editor and build units (${{ matrix.shard }}/${{ inputs.fast && 2 || 1 }})
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.fast && 5 || 15 }}
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(inputs.fast && '[1,2]' || '[1]') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm test -- --shard=${{ matrix.shard }}/${{ inputs.fast && 2 || 1 }}

    test:
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.fast && 5 || 15 }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: npm ci
            - run: npm run typecheck
            - run: npm run mobile:typecheck
            - name: Check research excerpt test types
              run: npm exec tsc -- --noEmit --project tests/tsconfig.research.json
            - name: Check independent math and CLI units
              run: |
                  npm test --workspace @writeme.dev/math
                  npm run build --workspace @writeme.dev/math
                  npm test --workspace @writeme.dev/cli
            - name: Lint tests and platform infrastructure
              run: >-
                  npm exec oxlint -- --deny-warnings
                  tests
                  build
                  playwright.*.config.ts
                  scripts/playwright-*.ts
                  scripts/e2e*.mts
                  scripts/pr-checks*.mts
                  scripts/build-*.ts
            - name: Check strict test and platform infrastructure types
              run: npm exec tsc -- --project tests/tsconfig.json
            - name: Check platform runner contracts
              run: npm run test:e2e:runner
            - name: Check merge gate contracts
              run: node --experimental-strip-types --test scripts/pr-checks.test.mts
