name: Desktop browser verification

on:
    workflow_call:
        inputs:
            fast:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    browser:
        name: >-
            Browser ${{ matrix.target.platform }}
            (${{ matrix.shard }}/${{ inputs.fast && 6 || 3 }})
        runs-on: ${{ matrix.target.os }}
        timeout-minutes: ${{ inputs.fast && 20 || 40 }}
        strategy:
            fail-fast: false
            max-parallel: ${{ inputs.fast && 6 || 6 }}
            matrix:
                shard: >-
                    ${{ fromJSON(inputs.fast &&
                    '[1,2,3,4,5,6]' ||
                    '[1,2,3]') }}
                target: >-
                    ${{ fromJSON(inputs.fast &&
                    '[{"platform":"linux","os":"ubuntu-latest"}]' ||
                    '[
                    {"platform":"windows","os":"windows-2022"},
                    {"platform":"osx","os":"macos-latest"},
                    {"platform":"linux","os":"ubuntu-latest"}
                    ]') }}
        env:
            CI: "true"
            NODE_OPTIONS: --max-old-space-size=4096
            WRITEME_E2E_FAST: ${{ inputs.fast && '1' || '0' }}
            PLAYWRIGHT_ARTIFACT_DIR: >-
                ${{ format(
                'artifacts/playwright/{0}/browser-{1}',
                matrix.target.platform,
                matrix.shard
                ) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npm exec playwright -- install --only-shell chromium
            - name: Run all browser regressions
              run: >-
                  npm run test:e2e -- --platform ${{ matrix.target.platform }}
                  --suite browser --project chromium
                  --shard ${{ matrix.shard }}/${{ inputs.fast && 6 || 3 }}
                  --workers ${{ inputs.fast && 4 || 2 }}
            - name: Upload shard evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: >-
                      browser-${{ matrix.target.platform }}-${{ matrix.shard }}
                  path: >-
                      ${{ format(
                      'artifacts/playwright/{0}/browser-{1}/',
                      matrix.target.platform,
                      matrix.shard
                      ) }}
                  if-no-files-found: error
                  retention-days: 14
